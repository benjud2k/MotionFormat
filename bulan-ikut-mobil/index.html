<script>
/* ================= MESIN MOTION FORMAT =================
   Aturan emas: semua gerak adalah fungsi dari waktu t (detik). Jangan pakai Date, performance.now,
   requestAnimationFrame, setTimeout, atau Math.random tanpa benih: render MP4 = lompat ke tiap frame. */
window.__errs=[];addEventListener('error',e=>__errs.push(String(e.message)));addEventListener('unhandledrejection',e=>__errs.push('Promise: '+String(e.reason&&e.reason.stack||e.reason)));
const W=1080,H=1920,RASIO='9:16',TEGAK=H>W,q=new URLSearchParams(location.search);
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);$('#stage').style.transform=`translate(-50%,-50%) scale(${s})`;}
addEventListener('resize',fit);fit();

/* ---------- matematika kecil ---------- */
const lerp=(a,b,k)=>a+(b-a)*k,clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const sstep=(a,b,x)=>{const k=clamp((x-a)/(b-a));return k*k*(3-2*k);};
const seg=(t,a,b)=>clamp((t-a)/(b-a));                 // 0..1 di rentang [a,b]
const E={lin:k=>k,out:k=>1-Math.pow(1-k,3),in:k=>k*k*k,io:k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2,
  s:k=>k*k*(3-2*k),ox:k=>k>=1?1:1-Math.pow(2,-10*k),
  back:k=>{const c1=1.6,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2);},
  pegas:k=>k>=1?1:1-Math.exp(-6*k)*Math.cos(12*k)};
const nz=(t,s=0)=>Math.sin(t*1.31+s*7.13)*.5+Math.sin(t*2.71+s*3.37)*.3+Math.sin(t*.613+s*1.71)*.2; // goyang halus -1..1
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const hash=n=>{const s=Math.sin(n*127.1+31.7)*43758.5453;return s-Math.floor(s);};

/* ---------- DOM & SVG ---------- */
function mk(tag,cls,parent,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;(parent||$('#stage')).appendChild(e);return e;}
function svgEl(tag,attrs,parent){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function kanvas(w=W,h=H,parent){const c=document.createElement('canvas');c.width=w;c.height=h;if(parent){c.style.cssText=`position:absolute;left:0;top:0;width:${w}px;height:${h}px`;parent.appendChild(c);}return c;}

/* ---------- teks per kata: masuk/keluar dengan blur berarah ---------- */
function split(el){const out=[];(function walk(n){[...n.childNodes].forEach(c=>{if(c.nodeType===3){const parts=c.textContent.split(/(\s+)/);const frag=document.createDocumentFragment();parts.forEach(p=>{if(!p)return;if(/^\s+$/.test(p)){frag.appendChild(document.createTextNode(' '));return;}const wd=document.createElement('span');wd.className='wd';const wi=document.createElement('span');wi.className='wi';wi.textContent=p;wd.appendChild(wi);frag.appendChild(wd);out.push(wi);});c.replaceWith(frag);}else if(c.nodeType===1&&!c.classList.contains('wd'))walk(c);});})(el);return out;}
const W8=el=>el._w||(el._w=split(el));
function wIn(tl,el,at,o={}){const ws=W8(el);tl.set(el,{autoAlpha:1},at);tl.fromTo(ws,{yPercent:o.y??80,xPercent:o.x??0,opacity:0,filter:`blur(${o.b??12}px)`,scaleY:o.sy??1.25},{yPercent:0,xPercent:0,opacity:1,filter:'blur(0px)',scaleY:1,duration:o.d??.6,ease:o.ease??'power3.out',stagger:o.st??.07},at);return tl;}
function wOut(tl,el,at,o={}){const ws=W8(el);tl.to(ws,{yPercent:o.y??-70,xPercent:o.x??0,opacity:0,filter:`blur(${o.b??10}px)`,duration:o.d??.35,ease:'power2.in',stagger:o.st??.025},at);tl.set(el,{autoAlpha:0},at+(o.d??.35)+ws.length*(o.st??.025));return tl;}

/* ---------- butiran film ---------- */
function grainOn(opacity=.3,blend='overlay'){const c=kanvas(220,220),x=c.getContext('2d'),d=x.createImageData(220,220),r=rng(7);for(let i=0;i<d.data.length;i+=4){const v=r()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}x.putImageData(d,0,0);const g=$('#grain');g.style.backgroundImage=`url(${c.toDataURL()})`;g.style.opacity=opacity;g.style.mixBlendMode=blend;}
function grainFrame(t){const k=Math.floor(t*12);$('#grain').style.transform=`translate(${(k*37)%64-32}px,${(k*53)%64-32}px)`;}

/* ---------- zona aman: tempat teks penting boleh berada ---------- */
const AMAN=TEGAK?{atas:180,bawah:H-300,kiri:70,kanan:W-150}:{atas:70,bawah:H-90,kiri:110,kanan:W-110};

/* ---------- LABEL PENUNJUK: titik + garis + teks, tanpa kotak ----------
   const L=label({x:540,y:900,dx:180,dy:-160,teks:'pompa air',warna:'#FFD27A'});
   di frame(t): L.atur(t, muncul, hilang)            -> garis menggambar, teks masuk
   objek bergerak / 3D: L.atur(t, muncul, hilang, xLayar, yLayar)  -> titik ikut objek, sisi teks dijaga di zona aman */
function label(o){const g=svgEl('g',{opacity:0},$('#mfLab'));const w=o.warna||'#FFE7B0',fs=o.ukuran||(TEGAK?54:44);
  const halo=svgEl('circle',{r:22,fill:w,opacity:.25},g),dot=svgEl('circle',{r:8,fill:w},g);
  const ln=svgEl('polyline',{fill:'none',stroke:w,'stroke-width':4,'stroke-linecap':'round','stroke-linejoin':'round'},g);
  const tt=svgEl('text',{fill:o.warnaTeks||'#FFFFFF','font-size':fs,'font-weight':o.tebal||800,style:'paint-order:stroke;stroke:rgba(0,0,0,.55);stroke-width:10px;stroke-linejoin:round'},g);tt.textContent=o.teks;
  let len=0,kunci='';
  function tata(x,y){const kk=Math.round(x)+','+Math.round(y);if(kk===kunci)return;kunci=kk;
    const d0=Math.abs(o.dx??160),lebar=fs*.58*String(o.teks).length+56;
    const muatKanan=x+d0+lebar<=AMAN.kanan,muatKiri=x-d0-lebar>=AMAN.kiri;
    let kanan=(o.dx??160)>=0?(muatKanan||!muatKiri&&AMAN.kanan-x>=x-AMAN.kiri):!(muatKiri||!muatKanan&&x-AMAN.kiri>=AMAN.kanan-x);
    let tx=kanan?Math.min(x+d0,AMAN.kanan-lebar):Math.max(x-d0,AMAN.kiri+lebar);   // tak ada sisi lega: siku digeser ke dalam
    const ty=clamp(y+(o.dy??-140),AMAN.atas+fs,AMAN.bawah-fs);
    halo.setAttribute('cx',x);halo.setAttribute('cy',y);dot.setAttribute('cx',x);dot.setAttribute('cy',y);
    ln.setAttribute('points',`${x},${y} ${tx},${ty} ${tx+(kanan?40:-40)},${ty}`);len=Math.hypot(tx-x,ty-y)+40;ln.setAttribute('stroke-dasharray',len);
    tt.setAttribute('x',tx+(kanan?56:-56));tt.setAttribute('y',ty+fs*.35);tt.setAttribute('text-anchor',kanan?'start':'end');}
  tata(o.x??W/2,o.y??H/2);
  return{g,atur(t,a,b=1e9,x,y){if(!tt._f){tt._f=1;tt.setAttribute('font-family',o.font||(SUB.cfg?SUB.cfg.font.replace(/^.*?\d+px\s*/,''):'system-ui,sans-serif'));}
    if(x!=null)tata(x,y);const k=E.out(seg(t,a,a+.5)),h=1-seg(t,b,b+.3);g.setAttribute('opacity',Math.min(1,k*3)*h);
    ln.setAttribute('stroke-dashoffset',len*(1-k));tt.setAttribute('opacity',E.out(seg(t,a+.25,a+.6)));halo.setAttribute('r',22+8*Math.sin(t*4));}};}

const MFlabel=label;   // nama cadangan bila adegan memakai nama `label` sendiri

/* ---------- SUBTITLE dinamis per kata ----------
   Sumber kata: SCENE.kata, atau window.KATA dari kata.js (dibuat `mf.py kata`). Format [{w,t0,t1}] detik layar.
   SCENE.sub = { gaya:'polos'|'pil'|'mati', maks:4, y:0.68 (pecahan tinggi) atau fungsi(t,frasa)->{x,y},
                 font:"800 64px 'Plus Jakarta Sans'", warna:'#fff', aksen:'#FFB547', kunci:['kata','kunci'] } */
const SUB={frasa:[],cfg:null};
function subSiapkan(kata,cfg){SUB.cfg=Object.assign({gaya:'polos',maks:TEGAK?4:6,y:TEGAK?.68:.84,warna:'#FFFFFF',aksen:'#FFB547',kunci:[],
  font:`800 ${TEGAK?64:52}px system-ui,sans-serif`},cfg||{});if(!kata||!kata.length||SUB.cfg.gaya==='mati')return;
  const c=SUB.cfg,box=$('#mfSub');box.style.font=c.font;box.style.color=c.warna;
  if(c.gaya==='pil'){box.style.textShadow='none';}else{box.style.textShadow='0 2px 2px rgba(0,0,0,.9),0 0 14px rgba(0,0,0,.75),0 0 40px rgba(0,0,0,.5)';}
  const norm=w=>String(w).toLowerCase().replace(/[^\p{L}\p{N}]/gu,''),kunci=new Set(c.kunci.map(norm));let cur=[];
  const tutup=()=>{if(cur.length)SUB.frasa.push(cur);cur=[];};
  kata.forEach((k,i)=>{const prev=kata[i-1];if(cur.length&&(cur.length>=c.maks||/[.,!?;:…]$/.test(prev.w)||k.t0-prev.t1>.35))tutup();cur.push(k);});tutup();
  SUB.frasa=SUB.frasa.map((ws,i)=>{const el=mk('div','sf',box);el.style.cssText=`position:absolute;left:0;width:100%;opacity:0;padding:0 ${W-AMAN.kanan}px 0 ${AMAN.kiri}px`;
    const inner=c.gaya==='pil'?mk('span','',el):el;if(c.gaya==='pil')inner.style.cssText='display:inline-block;padding:.12em .5em .18em;border-radius:.6em;background:rgba(12,12,20,.72)';
    const spans=ws.map(k=>{const s=mk('span','sw',inner);s.textContent=k.w;if(kunci.has(norm(k.w)))s.style.color=c.aksen;return s;});
    const nxt=kata.indexOf(ws[ws.length-1])+1;const akhir=Math.min(ws[ws.length-1].t1+.35,kata[nxt]?kata[nxt].t0-.07:1e9);
    return{el,spans,ws,a:ws[0].t0-.06,b:akhir};});}
function subFrame(t){if(!SUB.frasa.length)return;const c=SUB.cfg;SUB.frasa.forEach(f=>{const on=t>=f.a&&t<f.b;f.el.style.opacity=on?1:0;if(!on)return;
  let p=typeof c.y==='function'?c.y(t,f):{x:W/2,y:H*c.y};f.el.style.top=(p.y-f.el.offsetHeight/2)+'px';
  if(p.x!=null&&p.x!==W/2){f.el.style.left=(p.x-W/2)+'px';}else f.el.style.left='0px';
  f.spans.forEach((s,i)=>{const k=f.ws[i],m=E.back(seg(t,k.t0-.04,k.t0+.14));s.style.opacity=t<k.t0-.04?(c.gaya==='pil'?.35:0):1;s.style.transform=`translateY(${(1-m)*18}px) scale(${.86+.14*m})`;});});}
</script>
<script>
/* ==== [1] PILIH GAYA ==== */
const DIAGRAM = q.has('diagram');                         // contoh diagram sains (blok [9]); proyek sains: true
const VARIAN = q.get('v') || 'anime';                     // cara melukis
const SUASANA = q.get('s') || 'malam';  // palet + cahaya (lihat [2])

/* ==== [2] PALET SIAP PAKAI ==== */
// Kunci warna bersifat UMUM (dipakai di [6] lewat nama): langit · puncakJauh · bukitJauh · bukitTengah · dataran
// garisDataran · air · subjekA · subjekB · alur · lubang · dekat · depan · asap · kabut · awan/awanG

// Diagram ([9]): dgCahaya · dgPartikel · dgPanah · dgGaris (garis tepi gelap supaya terbaca di langit pucat)
const PALET = {
  'anime-fajar': {langit: [[0, '#1E2753'], [.27, '#4A4C8C'], [.47, '#B97498'], [.6, '#F2A47C'], [.7, '#FFDDA4']],
    surya: [205, 700, 62], inti: '#FFF7E0', halo: '#FFB877', sinar: '#FFD6A0', sinarKuat: 1.1, mekar: .32, noda: .5,
    vin: 'rgba(34,14,44,.6)', awan: '#FFD9BE', awanG: '#7A5C92',
    puncakJauh: '#8A84B3', bukitJauh: '#6F6A9D', bukitTengah: '#55598B', dataran: '#A48A94', garisDataran: '#F6CFA6',
    air: '#6C6A9C', subjekA: '#5D5677', lubang: '#2A2640', subjekB: '#44556B', alur: '#2B364A',
    dekat: '#25263F', depan: '#121325', asap: '#F6EAE6', kabut: '#F6D2C2', tinta: '#121325', rim: '#FFBF86',
    aksen: '#FFD27A', lampu: '#FFD27A', dgCahaya: '#FFF1C9', dgPartikel: '#3D7BFF', dgPanah: '#FFD23F', dgGaris: '#1B1430'},
  'anime-siang': {langit: [[0, '#2A64B8'], [.3, '#4D8FD6'], [.55, '#93C4EC'], [.7, '#DDF0F8']],
    surya: [215, 330, 56], inti: '#FFFFF4', halo: '#FFF3C4', sinar: '#FFF6D8', sinarKuat: .55, mekar: .16, noda: .3,
    vin: 'rgba(10,40,80,.32)', awan: '#FFFFFF', awanG: '#8FAACB',
    puncakJauh: '#8DAED2', bukitJauh: '#7EA6C6', bukitTengah: '#5E93A6', dataran: '#C9B48F', garisDataran: '#F2E2BE',
    air: '#3F86C4', subjekA: '#7D7471', lubang: '#3A302C', subjekB: '#4E7A5E', alur: '#2F5240',
    dekat: '#2F5D45', depan: '#1C3828', asap: '#FFFFFF', kabut: '#E6F2F8', tinta: '#14261C', rim: '#FFF4D2',
    aksen: '#FFD23F', lampu: '#FFD23F', dgCahaya: '#FFF4B8', dgPartikel: '#1E56FF', dgPanah: '#FF7A1A', dgGaris: '#0B1B3A'},

  if (a <= .01) return; const ang = .5 + Math.sin(t * 2.2) * .35, d = 30 * s, ax = Math.cos(ang) * d, ay = Math.sin(ang) * d;
  c.save(); c.globalAlpha = a; c.lineCap = 'round'; c.strokeStyle = PAL.dgGaris; c.lineWidth = 18 * s;
  c.beginPath(); c.moveTo(x - ax, y - ay); c.lineTo(x + ax, y + ay); c.stroke(); c.restore();
  titikJelas(c, x - ax, y - ay, 32 * s, warna, a); titikJelas(c, x + ax, y + ay, 32 * s, warna, a); }
function berkasCahaya(c, x0, y0, x1, y1, t, o = {}) {   // berkas tebal + denyut berjalan dari sumber ke sasaran
  const k = o.k ?? 1; if (k <= 0) return; const ex = lerp(x0, x1, k), ey = lerp(y0, y1, k), w = o.lebar ?? 34;
  const dx = ex - x0, dy = ey - y0, m = Math.hypot(dx, dy) || 1, nx = -dy / m, ny = dx / m;
  c.save(); c.globalAlpha = o.a ?? 1;
  c.beginPath(); c.moveTo(x0 + nx * w * .3, y0 + ny * w * .3); c.lineTo(ex + nx * w / 2, ey + ny * w / 2);
  c.lineTo(ex - nx * w / 2, ey - ny * w / 2); c.lineTo(x0 - nx * w * .3, y0 - ny * w * .3); c.closePath();
  c.lineWidth = 6; c.strokeStyle = rgba(PAL.dgGaris, .55); c.stroke();
  const g = c.createLinearGradient(x0, y0, ex, ey); g.addColorStop(0, rgba(PAL.dgCahaya, .95)); g.addColorStop(1, rgba(PAL.dgCahaya, .7));
  c.fillStyle = g; c.fill();
  c.setLineDash([26, 54]); c.lineDashOffset = -t * 260; c.lineCap = 'round'; c.lineWidth = w * .35; c.strokeStyle = 'rgba(255,255,255,.9)';
  c.beginPath(); c.moveTo(x0, y0); c.lineTo(ex, ey); c.stroke(); c.restore(); }
function panahEnergi(c, pts, t, o = {}) {   // panah tebal bergaris tepi, tergambar sepanjang jalur (o.k 0..1)
  const k = o.k ?? 1; if (k <= 0 || pts.length < 2) return; const L = [0];
  for (let i = 1; i < pts.length; i++) L.push(L[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const target = L[L.length - 1] * k, P = [pts[0]]; let ujung = pts[0], arah = [1, 0];
  for (let i = 1; i < pts.length; i++) { if (L[i] <= target) { P.push(pts[i]); ujung = pts[i]; }
    else { const f = (target - L[i - 1]) / (L[i] - L[i - 1]); ujung = [lerp(pts[i - 1][0], pts[i][0], f), lerp(pts[i - 1][1], pts[i][1], f)]; P.push(ujung); }
    arah = [pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]]; if (L[i] > target) break; }
  const w = o.tebal ?? 16, m = Math.hypot(arah[0], arah[1]) || 1, ux = arah[0] / m, uy = arah[1] / m, kep = w * 2.2;
  const jalur = cc => { cc.beginPath(); P.forEach((p, i) => i ? cc.lineTo(p[0], p[1]) : cc.moveTo(p[0], p[1])); };
  const kepala = () => { c.beginPath(); c.moveTo(ujung[0] + ux * kep * .8, ujung[1] + uy * kep * .8);
    c.lineTo(ujung[0] - ux * kep * .5 - uy * kep * .7, ujung[1] - uy * kep * .5 + ux * kep * .7);
    c.lineTo(ujung[0] - ux * kep * .5 + uy * kep * .7, ujung[1] - uy * kep * .5 - ux * kep * .7); c.closePath(); };
  c.save(); c.lineCap = 'round'; c.lineJoin = 'round'; c.globalAlpha = o.a ?? 1;
  jalur(c); c.lineWidth = w + 10; c.strokeStyle = PAL.dgGaris; c.stroke(); kepala(); c.lineWidth = 10; c.stroke();
  jalur(c); c.lineWidth = w; c.strokeStyle = o.warna || PAL.dgPanah; c.stroke(); kepala(); c.fillStyle = o.warna || PAL.dgPanah; c.fill();
  jalur(c); c.setLineDash([20, 44]); c.lineDashOffset = -t * 180; c.lineWidth = w * .35; c.strokeStyle = 'rgba(255,255,255,.75)'; c.stroke();
  c.restore(); }
function pencar(c, x, y, t, t0, o = {}) {   // gelombang partikel memencar ke segala arah dari (x,y), berulang tiap o.jeda dtk
  const n = o.n ?? 10, jeda = o.jeda ?? .9, umur = o.umur ?? 1.7, laju = o.laju ?? 300, r = o.r ?? 15;
  for (let g = 0; g < 12; g++) { const lahir = t0 + g * jeda, u = (t - lahir) / umur; if (u < 0 || u > 1) continue;
    for (let i = 0; i < n; i++) { const a = (i + .5) / n * TAU + g * .7 + hash(i + g * 13) * .4, d = laju * umur * E.out(u) * (.7 + .3 * hash(i * 3 + g));
      const px = x + Math.cos(a) * d, py = y + Math.sin(a) * d, al = Math.min(1, u * 6) * (1 - Math.pow(u, 3));
      c.save(); c.globalAlpha = al * .55; c.strokeStyle = o.warna || PAL.dgPartikel; c.lineWidth = r * .7; c.lineCap = 'round';
      c.beginPath(); c.moveTo(px - Math.cos(a) * r * 2.6, py - Math.sin(a) * r * 2.6); c.lineTo(px, py); c.stroke(); c.restore();
      titikJelas(c, px, py, r, o.warna || PAL.dgPartikel, al); } } }
// Contoh pemakaian (DIAGRAM = true): "kenapa langit biru" — cahaya matahari menabrak molekul udara, biru memencar ke mata.
const DG = {mol: [600, 560]};
function diagramContoh(c, t) {
  if (!DIAGRAM) return; c.save(); c.setTransform(1, 0, 0, 1, 0, 0);
  const [sx, sy] = layar(PAL.surya[0], PAL.surya[1], .03), [mx, my] = DG.mol, hilang = 1 - seg(t, 8.3, 8.6);
  berkasCahaya(c, sx, sy, mx, my, t, {k: E.out(seg(t, 3.3, 3.9)), a: hilang});
  molekul(c, mx, my, 1.3, t, Math.min(E.out(seg(t, 3.5, 3.9)), hilang));
  if (t < 8.6) pencar(c, mx, my, t, 4.0, {n: 9, jeda: 1.0, umur: 1.8, laju: 260, r: 16});
  const [ox, oy] = layar(TOKOH.x + 4, TOKOH.y - 182 * TOKOH.s, .85);
  panahEnergi(c, [[mx - 20, my + 50], [mx - 120, my + 300], [ox + 160, oy - 260], [ox + 30, oy - 30]], t,
    {k: E.io(seg(t, 5.4, 6.3)), a: hilang, tebal: 18});
  c.restore();
}

/* ==== [10] TEKS: judul, label, subtitle ==== */
const KICK = $('#tKick'), JUD = $('#tJudul'); KICK.style.top = (AMAN.atas + 40) + 'px'; JUD.style.top = (AMAN.atas + 110) + 'px';
const LW = {anime: ['#FFE7B0', '#FFFFFF'], noir: ['#C3D0DC', '#EEF2F5'], catair: ['#2B2B35', '#2B2B35'], ukiran: ['#2B1D14', '#2B1D14']}[V];
// WAKTU: semua detik penting adegan 1 di satu tempat (nanti dipetakan ulang ke suara asli)
const WAKTU = {judul: .6, judulKeluar: 3.3, gunung: 5.3, bulan: 7.0, labelKeluar: 8.3, tutup: [8.45, 9.55]};
const L1 = DUNIA[1], xG = 470 + LAJU * WAKTU.gunung * L1.p;   // titik di punggung gunung jauh yang ditunjuk label
const LBL = [
  [label({teks: 'gunung jauh', dx: 110, dy: -170, warna: LW[0], warnaTeks: LW[1], ukuran: 50}), WAKTU.gunung, WAKTU.labelKeluar,
    () => layar(xG, yBukit(L1, xG) + 14, L1.p)],
  [label({teks: 'Bulan', dx: -170, dy: -210, warna: LW[0], warnaTeks: LW[1], ukuran: 56}), WAKTU.bulan, WAKTU.labelKeluar,
    () => { const [x, y] = BULAN(); return [x - 52, y - 44]; }]
];
const SUBV = {anime: {gaya: 'polos', font: "700 62px 'Zen Maru Gothic'", aksen: PAL.aksen},
  noir: {gaya: 'pil', font: "800 56px 'Bitter'", warna: '#0B1020', aksen: '#B07A10'},
  catair: {gaya: 'pil', font: "800 60px 'Alegreya Sans'", warna: '#2B2B35', aksen: PAL.aksen},
  ukiran: {gaya: 'pil', font: "700 56px 'Spectral'", warna: '#2B1D14', aksen: '#B5442A'}}[V];
// waktu kata PERKIRAAN untuk gambar uji; setelah VO jadi diganti `mf.py kata` (kata.js).
const kataDari = (s, t0, t1) => { const w = s.split(' '), d = (t1 - t0) / w.length; return w.map((x, i) => ({w: x, t0: t0 + i * d, t1: t0 + (i + .9) * d})); };
const KATA = [...kataDari('Pohon di pinggir jalan lewat cepat banget,', 2.7, 5.0),
  ...kataDari('gunung di belakang geraknya pelan,', 5.1, 6.7), ...kataDari('tapi Bulan… diam aja, nempel terus.', 6.9, 8.6)];
if (KERTAS) grainOn(.16, 'multiply'); else grainOn(MALAM ? .24 : .14);

/* ==== [11] SCENE ==== */
const SCENE = {
  dur: 9.6,
  kata: KATA,
  sub: Object.assign({y: .81, maks: 4, kunci: ['bulan', 'cepat', 'pelan', 'nempel']}, SUBV),
  audio: {vo: [], sfx: [], music: null},
  build(tl) {
    tl.to(KICK, {opacity: 1, duration: .6, ease: 'power2.out'}, .35);
    wIn(tl, JUD, WAKTU.judul, {st: .17, d: .7});
    wOut(tl, JUD, WAKTU.judulKeluar); tl.to(KICK, {opacity: 0, duration: .4}, WAKTU.judulKeluar);
  },
  frame(t) {
    kamera(t); GL = []; GLK = AWAN_PEMBUKA ? seg(t, 1.6, 2.5) : 1;
    X.setTransform(1, 0, 0, 1, 0, 0); X.globalAlpha = 1; X.globalCompositeOperation = 'source-over';
    X.fillStyle = PAL.kertas || '#000'; X.fillRect(0, 0, W, H);
    dunia(X, t); awanPembuka(X, t); pasca(X, t); tutup(X, seg(t, WAKTU.tutup[0], WAKTU.tutup[1]), t);
    LBL.forEach(([L, a, b, pos]) => { const p = pos(); L.atur(t, a, b, p[0], p[1]); });
  }
};
</script>
<script>
/* ---------- boot: timeline, audio pratinjau, autoplay + loop, penggeser debug, API render ---------- */
(function(){
const DUR=SCENE.dur;const tl=gsap.timeline({paused:true});
if(SCENE.build)SCENE.build(tl);tl.set({},{},DUR);
window.AUDIO_PLAN=Object.assign({dur:DUR,vo:[],sfx:[],music:null,loops:[]},SCENE.audio||{});
subSiapkan(SCENE.kata||window.KATA,SCENE.sub);
const P=window.AUDIO_PLAN,EV=[];const A=src=>{const a=new Audio(src);a.preload='auto';return a;};
P.vo.forEach(v=>EV.push({at:v.at,el:A(v.src),vol:v.vol??1}));
if(P.music)EV.push({at:P.music.at||0,el:A(P.music.src),vol:Math.min(1,P.music.vol??.15),music:1});
P.sfx.forEach(s=>EV.push({at:s.at,el:A(s.src),vol:Math.min(1,s.vol??.5)}));
let live=false,lastT=0;const dbgOn=q.has('debug');
function frame(t){SCENE.frame&&SCENE.frame(t);subFrame(t);grainFrame(t);}
tl.eventCallback('onUpdate',()=>{const t=tl.time();frame(t);
  if(live&&!tl.paused())EV.forEach(e=>{if(e.at>=lastT&&e.at<t&&t-e.at<.25){e.el.volume=e.vol;e.el.currentTime=0;e.el.play().catch(()=>{});}});
  lastT=t;if(dbgOn){$('#dScrub').value=t/DUR*1000;$('#dClock').textContent=t.toFixed(2);}});
const stopAudio=()=>EV.forEach(e=>e.el.pause());
function start(){stopAudio();lastT=-1;live=true;tl.play(0);}
tl.eventCallback('onComplete',()=>start());
async function seek(t){live=false;tl.pause(t,true);frame(t);if(SCENE.siap)await SCENE.siap(t);}
window.MF={W,H,RASIO,DURATION:DUR,tl,ready:false,seek,play:start};
addEventListener('keydown',e=>{if(/^[rR]$/.test(e.key))start();if(e.code==='Space'){e.preventDefault();if(tl.paused())tl.play();else{tl.pause();stopAudio();}}});
if(dbgOn){$('#dbg').style.display='flex';const sc=$('#dScrub');sc.addEventListener('input',()=>{live=false;stopAudio();tl.pause();tl.time(sc.value/1000*DUR);frame(tl.time());});$('#dPlay').onclick=()=>{if(tl.paused()){live=true;lastT=tl.time();tl.play();}else{tl.pause();stopAudio();}};}
const muatAwal=SCENE.muat?Promise.resolve(SCENE.muat()):Promise.resolve();
Promise.all([document.fonts.ready,muatAwal]).then(()=>new Promise(r=>setTimeout(r,80))).then(()=>{
  try{tl.pause(0,true);frame(0);}catch(err){__errs.push('frame(0): '+String(err&&err.stack||err));}window.MF.ready=true;
  if(q.has('t')){seek(parseFloat(q.get('t'))||0);return;}
  if(q.has('clean'))return;
  const probe=EV.find(e=>e.music)||EV[0];if(!probe){start();return;}
  probe.el.volume=0;probe.el.play().then(()=>{probe.el.pause();start();}).catch(()=>{const go=()=>{removeEventListener('pointerdown',go);removeEventListener('keydown',go);start();};addEventListener('pointerdown',go);addEventListener('keydown',go);});
});
})();
</script>
